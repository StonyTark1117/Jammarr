allprojects {
    afterEvaluate {
        def launcherConfiguration = configurations.findByName('loomDevelopmentDependencies')
        if (launcherConfiguration != null && tasks.findByName('verifyLoomDevLauncher') == null) {
            // Gradle decorates custom task implementations.  The runtime type
            // is therefore RunGameTask_Decorated, not exactly RunGameTask;
            // walk its hierarchy so the real launcher task is never skipped.
            def isLoomRunGameTask = { task ->
                Class<?> type = task.class
                while (type != null) {
                    if (type.name == 'net.fabricmc.loom.task.RunGameTask') {
                        return true
                    }
                    type = type.superclass
                }
                return false
            }
            // AbstractRunTask copies its protected internalClasspath over the
            // public JavaExec classpath in exec().  Find that collection on
            // every Loom generation rather than mutating JavaExec.classpath,
            // which is necessarily discarded immediately before launch.
            def internalClasspathFor = { task ->
                Class<?> type = task.class
                java.lang.reflect.Method getter = null
                while (type != null && getter == null) {
                    try {
                        getter = type.getDeclaredMethod('getInternalClasspath')
                    } catch (NoSuchMethodException ignored) {
                        type = type.superclass
                    }
                }
                if (getter == null) {
                    throw new GradleException("RunGameTask does not expose internalClasspath: ${task.class.name}")
                }
                getter.setAccessible(true)
                return getter.invoke(task)
            }
            tasks.withType(JavaExec).configureEach { task ->
                // Loom finalizes RunGameTask after project evaluation. Setting
                // this classpath earlier is overwritten on newer Loom builds,
                // leaving dev-launch-injector as the main class with no JAR.
                // `mainClass` is a lazy provider and is not present yet on
                // older Loom tasks during afterEvaluate, so identify the
                // concrete task instead of silently skipping the injection.
                if (isLoomRunGameTask(task)) {
                    // The gate has already supplied an isolated Xvfb display.
                    // Loom enables its own xvfb-run whenever CI=true, but that
                    // branch invokes getAllJvmArgs() directly and omits the
                    // JVM argument provider that writes its @classpath file.
                    // Running on the prepared display preserves all headless
                    // isolation while letting JavaExec include that provider.
                    // Older Loom/Babric RunGameTask implementations do not
                    // expose useXvfb and do not take the newer nested-Xvfb
                    // execution path.  Configure the workaround only where
                    // that capability exists.
                    def supportsUseXvfb = task.hasProperty('useXvfb')
                    if (supportsUseXvfb) task.useXvfb.set(false)
                    logger.lifecycle("Configuring Loom launcher injection for ${task.path} (${task.class.name})")
                    def internalClasspath = internalClasspathFor(task)
                    internalClasspath.from(launcherConfiguration)
                    doFirst {
                        if (supportsUseXvfb && task.useXvfb.get()) {
                            throw new GradleException('RunGameTask must not start a nested CI Xvfb launcher')
                        }
                        logger.lifecycle("Verifying Loom launcher injection for ${task.path} (${task.class.name})")
                        if (!internalClasspath.files.any { it.name.startsWith('dev-launch-injector-') }) {
                            throw new GradleException('RunGameTask internalClasspath is missing dev-launch-injector at execution')
                        }
                    }
                }
            }
            tasks.register('verifyLoomDevLauncher') {
                doLast {
                    File injector = launcherConfiguration.files.find {
                        it.name.startsWith('dev-launch-injector-') && it.name.endsWith('.jar')
                    }
                    if (injector == null || !injector.isFile()) {
                        throw new GradleException('Client dev-launch-injector was not resolved')
                    }
                    new java.util.zip.ZipFile(injector).withCloseable { zip ->
                        if (zip.getEntry('net/fabricmc/devlaunchinjector/Main.class') == null) {
                            throw new GradleException("Client launcher is invalid: ${injector.name}")
                        }
                    }
                }
            }
        }
    }
}
