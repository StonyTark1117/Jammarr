allprojects {
    afterEvaluate {
        def launcherConfiguration = configurations.findByName('loomDevelopmentDependencies')
        if (launcherConfiguration != null && tasks.findByName('verifyLoomDevLauncher') == null) {
            tasks.withType(JavaExec).configureEach { task ->
                // Loom finalizes RunGameTask after project evaluation. Setting
                // this classpath earlier is overwritten on newer Loom builds,
                // leaving dev-launch-injector as the main class with no JAR.
                // `mainClass` is a lazy provider and is not present yet on
                // older Loom tasks during afterEvaluate, so identify the
                // concrete task instead of silently skipping the injection.
                if (task.class.name == 'net.fabricmc.loom.task.RunGameTask') {
                    doFirst {
                        // Loom finalizes/replaces its launch classpath after
                        // project evaluation. Merge immediately before
                        // JavaExec creates the process command so the
                        // dev-launch-injector main class is actually visible
                        // to the child JVM on every Loom generation.
                        task.classpath(task.classpath + launcherConfiguration)
                        if (!task.classpath.files.any { it.name.startsWith('dev-launch-injector-') }) {
                            throw new GradleException('RunGameTask is missing dev-launch-injector at execution')
                        }
                    }
                }
            }
            tasks.register('verifyLoomDevLauncher') {
                doLast {
                    File injector = launcherConfiguration.files.find {
                        it.name.startsWith('dev-launch-injector-') && it.name.endsWith('.jar')
                    }
                    if (injector == null || !injector.isFile()) {
                        throw new GradleException('Client dev-launch-injector was not resolved')
                    }
                    new java.util.zip.ZipFile(injector).withCloseable { zip ->
                        if (zip.getEntry('net/fabricmc/devlaunchinjector/Main.class') == null) {
                            throw new GradleException("Client launcher is invalid: ${injector.name}")
                        }
                    }
                }
            }
        }
    }
}
