plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

version = mod_version
group = mod_group_id

def targetManifestFile = layout.projectDirectory.file('gradle/targets.json')
def targetManifest = new JsonSlurper().parse(targetManifestFile.asFile)
if (targetManifest.schemaVersion != 1 || targetManifest.productVersion != mod_version
        || targetManifest.protocolVersion != 6) {
    throw new GradleException('gradle/targets.json does not match the active Jammarr version and protocol')
}
def plannedArtifacts = targetManifest.targets.collectMany { target ->
    target.loaders.collect { loader ->
        [minecraft: target.minecraft as String,
         java: target.java.runtime as Integer,
         buildJava: target.java.build as Integer,
         bytecodeJava: target.java.bytecode as Integer,
         loader: loader.id as String,
         status: loader.status as String,
         implemented: loader.implemented as Boolean,
         quiltCompatible: loader.quiltCompatible as Boolean,
         projectPath: loader.path as String,
         filename: loader.artifact as String]
    }
}
def implementedArtifacts = plannedArtifacts.findAll { it.implemented }
if (targetManifest.targets.size() != 26 || plannedArtifacts.size() != 68
        || plannedArtifacts.count { it.quiltCompatible } != 24 || implementedArtifacts.size() != 16) {
    throw new GradleException('Jammarr target manifest does not contain the expected 26/68/24/16 matrix')
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('jammarrAcceptanceServer').isPresent()) {
                gameDirectory = file(providers.gradleProperty('jammarrAcceptanceGameDir').get())
                programArguments.addAll '--username', providers.gradleProperty('jammarrAcceptanceUsername').get(),
                        '--quickPlayMultiplayer', providers.gradleProperty('jammarrAcceptanceServer').get()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-gametest').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.java.srcDir('test-fixtures/java/mc1.21')
sourceSets.test.resources {
    srcDir 'test-fixtures'
    exclude 'java/**'
}

def emptyGameTestInput = layout.projectDirectory.file('gradle/empty-gametest.nbt.b64')
def emptyGameTestOutput = layout.buildDirectory.dir('generated/gametestResources')
var generateGameTestTemplate = tasks.register('generateGameTestTemplate') {
    inputs.file(emptyGameTestInput)
    outputs.dir(emptyGameTestOutput)
    doLast {
        def inputFile = inputs.files.singleFile
        def outputFile = new File(outputs.files.singleFile, 'data/jammarr/structure/empty.nbt')
        outputFile.parentFile.mkdirs()
        outputFile.bytes = java.util.Base64.getDecoder().decode(inputFile.text.trim())
    }
}
sourceSets.main.resources.srcDir(generateGameTestTemplate)

dependencies {
    jarJar(implementation(project(':core')))
    additionalRuntimeClasspath(project(':core'))
    neoForgeTestLibraries(project(':core'))
    jarJar(implementation('javazoom:jlayer:1.0.1'))
    jarJar(implementation('de.sciss:jump3r:1.0.5'))
    // NeoForge 1.21.1 does not expose ordinary Java libraries to the
    // dedicated development run unless they are added to this classpath.
    additionalRuntimeClasspath('javazoom:jlayer:1.0.1')
    additionalRuntimeClasspath('de.sciss:jump3r:1.0.5')
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    inputs.property('jammarrLiveTestEnabled', providers.environmentVariable('JAMMARR_LIVE_TEST').orElse('false'))
    outputs.upToDateWhen { System.getenv('JAMMARR_LIVE_TEST') != 'true' }
    outputs.cacheIf('credentialed Plex integration tests must execute live') {
        System.getenv('JAMMARR_LIVE_TEST') != 'true'
    }
}

def verifyAudioTimingAnalyzer = tasks.register('verifyAudioTimingAnalyzer', Exec) {
    group = 'verification'
    description = 'Proves the rendered-audio oracle rejects early, late, reordered, and overlapping PCM.'
    commandLine('python3', layout.projectDirectory.file('scripts/test-audio-timing-analyzer.py').asFile)
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-${mod_version}+mc${minecraft_version}-neoforge.jar"
    from('THIRD_PARTY_NOTICES.md') {
        into('META-INF')
    }
    from('LICENSE') {
        into('META-INF')
        rename { 'LICENSE-Jammarr-CC0-1.0.txt' }
    }
    from('LICENSE-LGPL-2.1-or-later.txt') {
        into('META-INF')
    }
}

def releaseArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
def coreJarEntry = "META-INF/jarjar/stonytark.core-${mod_version}.jar".toString()
def releaseEntries = [coreJarEntry, 'META-INF/jarjar/jlayer-1.0.1.jar', 'META-INF/jarjar/jump3r-1.0.5.jar',
                      'META-INF/LICENSE-Jammarr-CC0-1.0.txt', 'META-INF/LICENSE-LGPL-2.1-or-later.txt',
                      'META-INF/THIRD_PARTY_NOTICES.md', 'META-INF/neoforge.mods.toml',
                      'assets/jammarr/lang/en_us.json', 'jammarr.mixins.json', 'jammarr.png']
tasks.register('verifyRelease') {
    dependsOn(tasks.named('test'), tasks.named('jar'), verifyAudioTimingAnalyzer)
    doLast {
        new java.util.zip.ZipFile(releaseArchive.get().asFile).withCloseable { zip ->
            def found = zip.entries().collect { it.name } as Set
            releaseEntries.each { entry ->
                if (!found.contains(entry)) throw new org.gradle.api.GradleException("Release archive is missing ${entry}")
            }
            new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry(coreJarEntry))).withCloseable { nested ->
                boolean foundCoreClass = false
                for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
                    if (entry.name == 'stonytark/jammarr/core/server/ChunkTransferPolicy.class') {
                        byte[] header = nested.readNBytes(8)
                        int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                        if (major != 52) throw new org.gradle.api.GradleException("Shared core is not Java 8 bytecode: class major ${major}")
                        foundCoreClass = true
                    }
                }
                if (!foundCoreClass) throw new org.gradle.api.GradleException('Release archive does not contain the shared transport core')
            }
            ['META-INF/neoforge.mods.toml', 'jammarr.mixins.json'].each { entry ->
                def text = zip.getInputStream(zip.getEntry(entry)).getText('UTF-8').toLowerCase(java.util.Locale.ROOT)
                if (text.contains('pampmod') || text.contains('pamp_')) {
                    throw new org.gradle.api.GradleException("Release archive still contains the old PAmpMod identifier in ${entry}")
                }
            }
        }
    }
}

def java26Home = providers.environmentVariable('JAMMARR_JAVA26_HOME')
        .orElse('/usr/lib/jvm/java-26-openjdk').get()
def java26Path = "${java26Home}/bin:${System.getenv('PATH')}"

def versionTaskKey = { String minecraft -> minecraft.replace('.', '') }
def loaderTaskName = { String loader -> loader == 'neoforge' ? 'NeoForge' : loader.capitalize() }
Map<String, TaskProvider> verifyTargetTasks = [:]
TaskProvider previousTargetTask = null
implementedArtifacts.each { artifact ->
    String versionKey = versionTaskKey(artifact.minecraft)
    String taskName = artifact.minecraft == '1.7.10' && artifact.loader == 'forge'
            ? 'verifyLegacy1710' : "verify${loaderTaskName(artifact.loader)}${versionKey}"
    TaskProvider predecessor = previousTargetTask
    TaskProvider registered
    if (artifact.projectPath == '.') {
        registered = tasks.register(taskName) {
            group = 'verification'
            description = "Runs the root Minecraft ${artifact.minecraft} ${artifact.loader} release gate from gradle/targets.json."
            dependsOn(':core:test', tasks.named('test'), tasks.named('verifyRelease'))
        }
    } else {
        registered = tasks.register(taskName, Exec) {
            group = 'verification'
            description = "Runs the isolated Minecraft ${artifact.minecraft} ${artifact.loader} release gate from gradle/targets.json."
            workingDir(layout.projectDirectory.dir(artifact.projectPath))
            if (artifact.buildJava >= 26) {
                environment 'JAVA_HOME', java26Home
                environment 'PATH', java26Path
            }
            List<String> arguments = ['./gradlew', 'verifyRelease']
            if (artifact.minecraft != '1.7.10') arguments.add(':core:test')
            arguments.addAll('--no-daemon', '--max-workers=1')
            if (artifact.loader != 'fabric') arguments.add('--no-configuration-cache')
            commandLine(arguments)
        }
    }
    if (predecessor != null) registered.configure { mustRunAfter(predecessor) }
    previousTargetTask = registered
    verifyTargetTasks["${artifact.minecraft}:${artifact.loader}"] = registered
}

def verifyGameTests = tasks.register('verifyGameTests', Exec) {
    group = 'verification'
    description = 'Runs NeoForge GameTests and cleans up a successful lingering server process.'
    workingDir(layout.projectDirectory)
    commandLine('bash', 'scripts/run-gametest-gate.sh')
}

List<TaskProvider> verifyFamilyTasks = []
implementedArtifacts.groupBy { it.minecraft }.each { minecraft, artifacts ->
    TaskProvider family = tasks.register("verify${versionTaskKey(minecraft)}Family") {
        group = 'verification'
        description = "Builds and verifies every implemented Minecraft ${minecraft} artifact from gradle/targets.json."
        dependsOn(artifacts.collect { verifyTargetTasks["${minecraft}:${it.loader}"] })
    }
    verifyFamilyTasks.add(family)
}

tasks.register('verifyAllTargets') {
    group = 'verification'
    description = 'Builds and verifies every currently registered Jammarr target.'
    dependsOn(verifyFamilyTasks, verifyGameTests)
}

def canonicalArtifacts = implementedArtifacts.collect { artifact ->
    String base = artifact.projectPath == '.' ? '' : "${artifact.projectPath}/"
    [minecraft: artifact.minecraft, java: artifact.java, loader: artifact.loader,
     path: "${base}build/libs/${artifact.filename}"]
}

def catalogVersions = { String minecraft ->
    File catalog = layout.projectDirectory.file("gradle/version-catalogs/mc-${minecraft}.toml").asFile
    Map<String, String> versions = [:]
    boolean inVersions = false
    catalog.eachLine('UTF-8') { line ->
        String value = line.trim()
        if (value.startsWith('[')) inVersions = value == '[versions]'
        else if (inVersions) {
            def match = value =~ /^([a-z0-9-]+)\s*=\s*"([^"]+)"$/
            if (match.matches()) versions[match.group(1)] = match.group(2)
        }
    }
    return versions
}

def sha256 = { File file ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) if (count > 0) digest.update(buffer, 0, count)
    }
    return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def prebuiltArtifactDirectory = providers.gradleProperty('jammarrPrebuiltArtifactDir')
def canonicalArtifactSource = { artifact ->
    String filename = "jammarr-${mod_version}+mc${artifact.minecraft}-${artifact.loader}.jar"
    if (prebuiltArtifactDirectory.isPresent()) {
        return layout.projectDirectory.dir(prebuiltArtifactDirectory.get()).file(filename).asFile
    }
    return layout.projectDirectory.file(artifact.path).asFile
}

def indexRelease = tasks.register('indexReleaseArtifacts') {
    group = 'verification'
    description = "Indexes ${implementedArtifacts.size()} implemented runtime JARs and writes the release manifest/checksums."
    inputs.file(targetManifestFile)
    notCompatibleWithConfigurationCache('Release indexing reads the independently built target files at execution time')
    inputs.files(canonicalArtifacts.collect { artifact -> canonicalArtifactSource(artifact) })
    outputs.dir(layout.buildDirectory.dir('releases'))
    doLast {
        File releaseDirectory = layout.buildDirectory.dir('releases').get().asFile
        if (releaseDirectory.exists() && !releaseDirectory.deleteDir()) {
            throw new GradleException("Could not clean release directory ${releaseDirectory}")
        }
        releaseDirectory.mkdirs()
        List<Map<String, Object>> manifestArtifacts = []
        canonicalArtifacts.each { artifact ->
            File source = canonicalArtifactSource(artifact)
            if (!source.isFile()) throw new GradleException("Missing release artifact ${artifact.path}")
            String expected = "jammarr-${mod_version}+mc${artifact.minecraft}-${artifact.loader}.jar"
            if (source.name != expected) throw new GradleException("Non-canonical artifact name ${source.name}; expected ${expected}")
            File target = new File(releaseDirectory, expected)
            java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            Map<String, String> versions = catalogVersions(artifact.minecraft as String)
            Map<String, String> dependencies = new TreeMap<String, String>(versions)
            dependencies.remove('minecraft')
            dependencies.remove('java')
            List<String> compatibleLoaders = artifact.loader == 'fabric'
                    ? ['fabric', 'quilt'] : [artifact.loader as String]
            manifestArtifacts << [productVersion: mod_version, minecraftVersion: artifact.minecraft,
                                  loader: artifact.loader, javaVersion: artifact.java,
                                  compatibleLoaders: compatibleLoaders,
                                  dependencies: dependencies, filename: expected, sha256: sha256(target)]
        }
        if (manifestArtifacts.size() != implementedArtifacts.size()) {
            throw new GradleException("Expected ${implementedArtifacts.size()} release artifacts, found ${manifestArtifacts.size()}")
        }
        Map<String, Object> manifest = [schemaVersion: 2, product: 'Jammarr', modId: mod_id,
                                        productVersion: mod_version, protocolVersion: targetManifest.protocolVersion,
                                        artifacts: manifestArtifacts]
        new File(releaseDirectory, 'manifest.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
        new File(releaseDirectory, 'SHA256SUMS').setText(manifestArtifacts.collect {
            "${it.sha256}  ${it.filename}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

def assembleRelease = tasks.register('assembleReleaseArtifacts') {
    group = 'verification'
    description = "Builds all ${implementedArtifacts.size()} implemented runtime JARs, then indexes the release manifest/checksums."
    dependsOn(tasks.named('verifyAllTargets'), indexRelease)
}
indexRelease.configure {
    mustRunAfter(tasks.named('verifyAllTargets'))
}

tasks.register('releaseMatrixGate') {
    group = 'verification'
    description = "Builds, tests, inspects, and indexes all ${implementedArtifacts.size()} implemented Jammarr artifacts."
    dependsOn('inspectReleaseArtifacts', 'verifyDedicatedServers', 'verifyFabricLoaderMinimumRuntimes',
            'verifyQuiltModMenuRuntimes')
}

tasks.register('inspectReleaseArtifacts', Exec) {
    group = 'verification'
    description = "Inspects metadata, bytecode, key mappings, libraries, assets, notices, credentials, and checksums in all ${implementedArtifacts.size()} release JARs."
    dependsOn(assembleRelease)
    workingDir(layout.projectDirectory)
    commandLine('python3', 'scripts/inspect-release-artifacts.py', layout.buildDirectory.dir('releases').get().asFile.absolutePath)
}

tasks.register('verifyDedicatedServers', Exec) {
    group = 'verification'
    description = 'Runs all 21 loader/version real-server, incompatible-client, command, and observable two-client audio gates.'
    mustRunAfter('inspectReleaseArtifacts')
    workingDir(layout.projectDirectory)
    environment('JAMMARR_PROTOCOL_CLIENT_GATE', 'true')
    environment('JAMMARR_COMMAND_CLIENT_GATE', 'true')
    environment('JAMMARR_AUDIO_CLIENT_GATE', 'true')
    environment('JAMMARR_AUDIO_SCENARIO_GATE', 'true')
    commandLine('bash', 'scripts/run-dedicated-server-gate.sh', 'all')
}

tasks.register('verifyQuiltRuntimes', Exec) {
    group = 'verification'
    description = 'Runs the five supported Quilt real-server, incompatible-client, command, and observable two-client audio gates.'
    workingDir(layout.projectDirectory)
    environment('JAMMARR_PROTOCOL_CLIENT_GATE', 'true')
    environment('JAMMARR_COMMAND_CLIENT_GATE', 'true')
    environment('JAMMARR_AUDIO_CLIENT_GATE', 'true')
    environment('JAMMARR_AUDIO_SCENARIO_GATE', 'true')
    commandLine('bash', 'scripts/run-dedicated-server-gate.sh', 'quilt')
}

tasks.register('verifyQuiltModMenuRuntimes', Exec) {
    group = 'verification'
    description = 'Repeats the five complete Quilt client scenarios with Mod Menu installed.'
    workingDir(layout.projectDirectory)
    environment('JAMMARR_GATE_OUTPUT_ROOT', layout.buildDirectory.dir('quilt-modmenu-gate').get().asFile.absolutePath)
    environment('JAMMARR_QUILT_MODMENU_GATE', 'true')
    environment('JAMMARR_PROTOCOL_CLIENT_GATE', 'true')
    environment('JAMMARR_COMMAND_CLIENT_GATE', 'true')
    environment('JAMMARR_AUDIO_CLIENT_GATE', 'true')
    environment('JAMMARR_AUDIO_SCENARIO_GATE', 'true')
    commandLine('bash', 'scripts/run-dedicated-server-gate.sh', 'quilt')
    mustRunAfter('verifyDedicatedServers')
}

tasks.register('verifyFabricLoaderMinimumRuntimes', Exec) {
    group = 'verification'
    description = 'Starts every modern Fabric target under the declared minimum Fabric Loader 0.19.2.'
    workingDir(layout.projectDirectory)
    environment('JAMMARR_GATE_OUTPUT_ROOT', layout.buildDirectory.dir('fabric-loader-0.19.2-gate').get().asFile.absolutePath)
    environment('JAMMARR_FABRIC_LOADER_VERSION', '0.19.2')
    commandLine('bash', 'scripts/run-dedicated-server-gate.sh', 'fabric')
    mustRunAfter('verifyQuiltModMenuRuntimes')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
