name: Jammarr CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Generate target matrices
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.generate.outputs.artifact }}
      runtime: ${{ steps.generate.outputs.runtime }}
      expected_artifacts: ${{ steps.generate.outputs.expected_artifacts }}
    steps:
      - uses: actions/checkout@v4
      - id: generate
        name: Generate matrices from gradle/targets.json
        run: |
          echo "artifact=$(python3 scripts/target-matrix.py artifact-matrix)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(python3 scripts/target-matrix.py runtime-matrix)" >> "$GITHUB_OUTPUT"
          echo "expected_artifacts=$(python3 scripts/target-matrix.py summary | jq -r .artifacts)" >> "$GITHUB_OUTPUT"

  artifact:
    name: ${{ matrix.name }}
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.matrix.outputs.artifact) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Record Java 8 home
        run: echo "JAMMARR_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Record Java 17 home
        run: echo "JAMMARR_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Record Java 26 home
        run: echo "JAMMARR_JAVA26_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Record Java 21 home
        run: echo "JAMMARR_JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Build and inspect artifact
        run: |
          for attempt in 1 2 3; do
            if ./gradlew ${{ matrix.task }} --no-daemon --max-workers=1; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Artifact verification attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jar-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
      - name: Run GameTests
        if: ${{ matrix.game_tests }}
        run: bash scripts/run-gametest-gate.sh
      - name: Upload GameTest diagnostics
        if: ${{ always() && matrix.game_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: gametest-diagnostics-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: build/gametest-gate.log

  runtime:
    name: Runtime ${{ matrix.name }}
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.matrix.outputs.runtime) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install headless audio acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg iproute2 libasound2-plugins libgl1-mesa-dri libopenal1 pipewire pipewire-pulse pulseaudio-utils wireplumber x11-xserver-utils xvfb
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' xrandr --query
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Record Java 8 home
        run: echo "JAMMARR_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Record Java 17 home
        run: echo "JAMMARR_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Record Java 26 home
        run: echo "JAMMARR_JAVA26_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Record Java 21 home
        run: echo "JAMMARR_JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Validate ${{ matrix.runtime }} runtime
        env:
          JAMMARR_ALSA_PCM_TYPE: pulse
          JAMMARR_PROTOCOL_CLIENT_GATE: 'true'
          JAMMARR_COMMAND_CLIENT_GATE: 'true'
          JAMMARR_AUDIO_CLIENT_GATE: 'true'
          JAMMARR_AUDIO_SCENARIO_GATE: 'true'
        run: bash scripts/run-dedicated-server-gate.sh ${{ matrix.runtime }}
      - name: Validate ${{ matrix.runtime }} with Mod Menu
        if: ${{ matrix.quilt_mod_menu }}
        env:
          JAMMARR_ALSA_PCM_TYPE: pulse
          JAMMARR_GATE_OUTPUT_ROOT: ${{ github.workspace }}/build/quilt-modmenu-gate
          JAMMARR_QUILT_MODMENU_GATE: 'true'
          JAMMARR_PROTOCOL_CLIENT_GATE: 'true'
          JAMMARR_COMMAND_CLIENT_GATE: 'true'
          JAMMARR_AUDIO_CLIENT_GATE: 'true'
          JAMMARR_AUDIO_SCENARIO_GATE: 'true'
        run: bash scripts/run-dedicated-server-gate.sh ${{ matrix.runtime }}
      - name: Validate minimum Fabric Loader
        if: ${{ matrix.minimum_fabric_loader }}
        env:
          JAMMARR_ALSA_PCM_TYPE: pulse
          JAMMARR_GATE_OUTPUT_ROOT: ${{ github.workspace }}/build/fabric-loader-0.19.2-gate
          JAMMARR_FABRIC_LOADER_VERSION: 0.19.2
        run: bash scripts/run-dedicated-server-gate.sh ${{ matrix.runtime }}
      - name: Upload runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/dedicated-server-gate/**/*.log
            build/dedicated-server-gate/**/*.txt
            build/dedicated-server-gate/**/*.json
            build/dedicated-server-gate/**/*.tsv
            build/quilt-modmenu-gate/**/*.log
            build/quilt-modmenu-gate/**/*.txt
            build/quilt-modmenu-gate/**/*.json
            build/quilt-modmenu-gate/**/*.tsv
            build/fabric-loader-0.19.2-gate/**/*.log
            build/fabric-loader-0.19.2-gate/**/*.txt
            build/fabric-loader-0.19.2-gate/**/*.json
            build/fabric-loader-0.19.2-gate/**/*.tsv

  release-gate:
    name: 1.1.0 release gate
    needs: [matrix, artifact, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Download all verified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-jar-*
          path: build/prebuilt-release
          merge-multiple: true
      - name: Assemble and inspect release bundle
        env:
          EXPECTED_ARTIFACTS: ${{ needs.matrix.outputs.expected_artifacts }}
        run: |
          test "$(find build/prebuilt-release -maxdepth 1 -type f \( -name '*.jar' -o -name '*.litemod' \) | wc -l)" -eq "$EXPECTED_ARTIFACTS"
          ./gradlew indexReleaseArtifacts -PjammarrPrebuiltArtifactDir=build/prebuilt-release --no-daemon --max-workers=1
          python3 scripts/inspect-release-artifacts.py build/releases
          (cd build/releases && sha256sum -c SHA256SUMS)
      - name: Upload 1.1.0 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: jammarr-1.1.0-${{ github.sha }}
          path: build/releases
          if-no-files-found: error
          retention-days: 14
