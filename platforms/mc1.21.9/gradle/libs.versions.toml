[versions]
minecraft = "1.21.9"
java = "21"
fabric-loom = "1.17.19"
fabric-loader = "0.19.3"
quilt-loader = "0.30.0"
fabric-api = "0.134.1+1.21.9"
modmenu = "16.0.1"
forgegradle = "6.0.54"
forge-loader = "59.0.5"
jlayer = "1.0.1"
jump3r = "1.0.5"
junit = "5.10.2"

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle" }

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
quilt-loader = { module = "org.quiltmc:quilt-loader", version.ref = "quilt-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
forge = { module = "net.minecraftforge:forge", version.ref = "forge-loader" }
jlayer = { module = "javazoom:jlayer", version.ref = "jlayer" }
jump3r = { module = "de.sciss:jump3r", version.ref = "jump3r" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
