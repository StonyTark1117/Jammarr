pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Ornithe Releases'; url = 'https://maven.ornithemc.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'jammarr-mc1.8.9-ornithe'
include 'core'
project(':core').projectDir = file('../../../core')
