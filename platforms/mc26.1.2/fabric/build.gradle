plugins {
    alias(libs.plugins.fabric.loom)
}
apply from: file('../../../gradle/quilt-runtime.gradle')

group = 'stonytark'
version = '1.0.0'
def artifactVersion = version.toString()
def runtimeLoader = providers.gradleProperty('jammarrRuntimeLoader').orElse('fabric')
def quiltRuntime = runtimeLoader.map { it == 'quilt' }
def quiltRuntimeLibraries = jammarrQuiltRuntimeProfiles[libs.versions.quilt.loader.get()]
def quiltClassPathGroup = [
        layout.buildDirectory.dir('classes/java/main').get().asFile,
        layout.buildDirectory.dir('resources/main').get().asFile,
        project(':core').layout.buildDirectory.dir('classes/java/main').get().asFile,
        project(':core').layout.buildDirectory.dir('resources/main').get().asFile
].join(File.pathSeparator)
if (!(runtimeLoader.get() in ['fabric', 'quilt'])) {
    throw new GradleException("Unsupported Jammarr runtime loader: ${runtimeLoader.get()}")
}

base {
    archivesName = "jammarr-${project.version}+mc26.1.2-fabric"
}

loom {
    runs {
        server {
            if (quiltRuntime.get()) {
                property 'fabric.dli.main', 'org.quiltmc.loader.impl.launch.knot.KnotServer'
                property 'loader.development', 'true'
                property 'loader.remapClasspathFile', file('.gradle/loom-cache/remapClasspath.txt').absolutePath
                property 'loader.classPathGroups', quiltClassPathGroup
            }
            if (providers.gradleProperty('jammarrServerGameDir').isPresent()) {
                runDir providers.gradleProperty('jammarrServerGameDir').get()
            }
        }
        client {
            if (quiltRuntime.get()) {
                property 'fabric.dli.main', 'org.quiltmc.loader.impl.launch.knot.KnotClient'
                property 'loader.development', 'true'
                property 'loader.remapClasspathFile', file('.gradle/loom-cache/remapClasspath.txt').absolutePath
                property 'loader.classPathGroups', quiltClassPathGroup
            }
            if (providers.gradleProperty('jammarrAcceptanceServer').isPresent()) {
                runDir providers.gradleProperty('jammarrAcceptanceGameDir').get()
                programArgs '--username', providers.gradleProperty('jammarrAcceptanceUsername').get(),
                        '--quickPlayMultiplayer', providers.gradleProperty('jammarrAcceptanceServer').get()
            }
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.quiltmc.org/repository/release/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${libs.versions.minecraft.get()}"
    implementation quiltRuntime.get() ? libs.quilt.loader : libs.fabric.loader
    if (quiltRuntime.get()) quiltRuntimeLibraries.each { implementation it }
    implementation libs.fabric.api
    compileOnly libs.modmenu

    implementation project(':core')
    include project(':core')
    implementation libs.jlayer
    include libs.jlayer
    implementation libs.jump3r
    include libs.jump3r
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

dependencyLocking { lockAllConfigurations() }
if (quiltRuntime.get()) {
    configurations.configureEach {
        resolutionStrategy.deactivateDependencyLocking()
        quiltRuntimeLibraries.each { dependency -> resolutionStrategy.force(dependency) }
    }
}

sourceSets {
    main {
        java {
            setSrcDirs([file('../../../src/main/java'), file('../common/src/main'), file('src/main')])
            exclude 'stonytark/jammarr/Jammarr.java'
            exclude 'stonytark/jammarr/client/JammarrClient.java'
            exclude 'stonytark/jammarr/client/JammarrClientConfigScreen.java'
            exclude 'stonytark/jammarr/client/JammarrClientState.java'
            exclude 'stonytark/jammarr/client/JammarrScreen.java'
            exclude 'stonytark/jammarr/config/JammarrConfig.java'
            exclude 'stonytark/jammarr/gametest/**'
            exclude 'stonytark/jammarr/network/JammarrNetwork.java'
            exclude 'stonytark/jammarr/network/JammarrPayloads.java'
            exclude 'stonytark/jammarr/server/JammarrCommands.java'
            exclude 'stonytark/jammarr/server/JammarrPermissions.java'
            exclude 'stonytark/jammarr/server/JammarrServer.java'
            exclude 'stonytark/jammarr/server/JammarrSavedData.java'
            exclude 'stonytark/jammarr/server/QueueTrackCodec.java'
            exclude 'stonytark/jammarr/server/StationDefinition.java'
        }
        resources {
            srcDir file('../../../src/main/resources')
            exclude 'META-INF/neoforge.mods.toml'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
sourceSets.test.java.srcDir(file('../../../test-fixtures/java/mc26.1.2'))
sourceSets.test.resources { srcDir file('../../../test-fixtures'); exclude 'java/**' }
tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.named('processResources') {
    inputs.property 'version', artifactVersion
    filesMatching('fabric.mod.json') { expand version: artifactVersion }
    filesMatching('jammarr.mixins.json') {
        filter {
            it.replace('"JAVA_21"', '"JAVA_25"')
                    .replace('"mixins": [', '"mixins": [\n    "QuiltServerBootstrapMixin"')
                    .replace('"client": [', '"client": [\n    "client.QuiltClientBootstrapMixin",')
        }
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "jammarr-${project.version}+mc26.1.2-fabric.jar"
    from('../../../THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('../../../LICENSE') {
        into('META-INF')
        rename { 'LICENSE-Jammarr-CC0-1.0.txt' }
    }
    from('../../../LICENSE-LGPL-2.1-or-later.txt') { into('META-INF') }
}

def releaseArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
def expectedReleaseName = "jammarr-${artifactVersion}+mc26.1.2-fabric.jar"
def releaseEntries = ['META-INF/jars/core-1.0.0.jar', 'META-INF/jars/jlayer-1.0.1.jar',
                      'META-INF/jars/jump3r-1.0.5.jar', 'META-INF/LICENSE-Jammarr-CC0-1.0.txt',
                      'META-INF/LICENSE-LGPL-2.1-or-later.txt', 'META-INF/THIRD_PARTY_NOTICES.md',
                      'fabric.mod.json', 'jammarr.mixins.json', 'jammarr.png',
                      'assets/jammarr/lang/en_us.json', 'stonytark/jammarr/Jammarr.class',
                      'stonytark/jammarr/client/JammarrClient.class',
                      'stonytark/jammarr/client/JammarrModMenu.class',
                      'stonytark/jammarr/network/JammarrNetwork.class']

tasks.register('verifyRelease') {
    group = 'verification'
    dependsOn(tasks.named('build'))
    doLast {
        def archive = releaseArchive.get().asFile
        if (archive.name != expectedReleaseName) {
            throw new GradleException("Unexpected release filename: ${archive.name}")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def found = zip.entries().collect { it.name } as Set
            releaseEntries.each { entry ->
                if (!found.contains(entry)) throw new GradleException("Release archive is missing ${entry}")
            }
            def metadata = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('fabric.mod.json')).getText('UTF-8'))
            if (metadata.id != 'jammarr' || metadata.depends.minecraft != '~26.1.2'
                    || metadata.depends.java != '>=25' || metadata.depends.fabricloader != '>=0.19.2') {
                throw new GradleException('Fabric metadata does not identify the expected mod, Minecraft, and Java versions')
            }
            if (!zip.getInputStream(zip.getEntry('jammarr.mixins.json')).getText('UTF-8').contains('"JAVA_25"')) {
                throw new GradleException('Fabric 26.1.2 mixin metadata does not target Java 25')
            }
            byte[] platformHeader = zip.getInputStream(zip.getEntry('stonytark/jammarr/Jammarr.class')).readNBytes(8)
            int platformMajor = ((platformHeader[6] & 0xff) << 8) | (platformHeader[7] & 0xff)
            if (platformMajor != 69) throw new GradleException("Fabric platform classes are not Java 25 bytecode: class major ${platformMajor}")
            new java.util.zip.ZipInputStream(zip.getInputStream(zip.getEntry('META-INF/jars/core-1.0.0.jar'))).withCloseable { nested ->
                boolean foundCoreClass = false
                for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
                    if (entry.name == 'stonytark/jammarr/core/server/ChunkTransferPolicy.class') {
                        byte[] header = nested.readNBytes(8)
                        int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                        if (major != 52) throw new GradleException("Shared core is not Java 8 bytecode: class major ${major}")
                        foundCoreClass = true
                    }
                }
                if (!foundCoreClass) throw new GradleException('Release archive does not contain the shared transport core')
            }
        }
    }
}
